# ─────────────────────────────────────────────────────────────────────
# Dijital Tabağım – Codemagic
#
# iOS derlemesinden önce Codemagic'te (bir kez):
#   1. Team settings > Integrations > Developer Portal
#        App Store Connect API anahtarını ekleyin. Anahtar adı aşağıdaki
#        `integrations.app_store_connect` değeriyle AYNI olmalı.
#   2. Team settings > Code signing identities
#        iOS certificates  > "Generate certificate" (Apple Distribution)
#        iOS provisioning profiles > "Fetch profiles"
#          (com.dijitaltabagim.dijitaltabak için App Store profili)
#   3. (İsteğe bağlı) Uygulama > Environment variables
#        SUPABASE_URL ve SUPABASE_ANON_KEY. Tanımlı değilse .env.example
#        kullanılır ve uygulama Supabase'e bağlanmaz.
# ─────────────────────────────────────────────────────────────────────

workflows:
  ios-workflow:
    name: Dijital Tabağım iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: DijitalTabagim ASC

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dijitaltabagim.dijitaltabak
      vars:
        APP_STORE_APPLE_ID: 6831739244

    scripts:
      - name: .env dosyasını oluştur
        script: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          else
            echo "Supabase değişkenleri tanımlı değil, .env.example kullanılıyor."
            cp .env.example .env
          fi

      - name: Flutter paketlerini yükle
        script: flutter pub get

      - name: Xcode imzalama ayarlarını uygula
        script: xcode-project use-profiles

      - name: CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: IPA oluştur
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST_BUILD" ] && LATEST_BUILD=0
          echo "Son build numarası: $LATEST_BUILD"
          flutter build ipa --release \
            --build-number=$((LATEST_BUILD + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Dijital Tabağım Android
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: .env dosyasını oluştur
        script: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          else
            echo "Supabase değişkenleri tanımlı değil, .env.example kullanılıyor."
            cp .env.example .env
          fi

      - name: Flutter paketlerini yükle
        script: flutter pub get

      - name: APK oluştur
        script: flutter build apk --release

      - name: App Bundle oluştur
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
